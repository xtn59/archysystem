# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################
#
#xwayland {
#	enabled = false
#} if you don't use xwayland apps, then uncomment this
#  xwayland apps that are included with archysystem are:
#  xterm
#  that's it

monitor=eDP-1,highres,auto,1
monitor=eDP-2,highres,auto,1
monitor=DP-1,highres,auto,1
monitor=DP-2,highres,auto,1
monitor=DP-3,highres,auto,1
monitor=DP-4,highres,auto,1
monitor=HDMI-A-1,highres,auto,1
monitor=HDMI-A-2,highres,auto,1
monitor=HDMI-A-3,highres,auto,1
monitor=HDMI-A-4,highres,auto,1

exec-once = waybar
exec-once = swww-daemon
exec-once = swww img ~/.archysystem/wallpapers/modern.jpg

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
general {
    gaps_in = 7.5 #5
    gaps_out = 15 #10
    border_size = 1
    col.active_border = rgba(000000ff)
    col.inactive_border = rgba(000000ff)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 0.80
    inactive_opacity = 0.75
    shadow {
        enabled = true
        range = 2
        render_power = 1
        color = rgba(2b2b2b25)
    }
    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 1
    }
}
animations {
    enabled = yes
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     4,     default
    animation = border,        1,     3,     easeOutQuint
    animation = windows,       1,     1,     easeOutQuint, slide
    animation = windowsIn,     1,     5,     easeOutQuint, slide
    animation = windowsOut,    1,     5,     easeOutQuint, slide
    animation = fadeIn,        1,     3,     easeOutQuint
    animation = fadeOut,       1,     3,     easeOutQuint
    animation = fade,          1,     3,     easeOutQuint
    animation = layers,        1,     3,     easeOutQuint, slide
    animation = layersIn,      1,     2,     easeOutQuint, slide
    animation = layersOut,     1,     2,     easeOutQuint, slide
    animation = fadeLayersIn,  1,     5,     easeOutQuint
    animation = fadeLayersOut, 1,     10,     easeOutQuint
    animation = workspaces,    1,     4,     easeOutQuint, slide
    animation = workspacesIn,  1,     4,     easeOutQuint, slide
    animation = workspacesOut, 1,     4,     easeOutQuint, slide
    animation = zoomFactor,    1,     5,     easeOutQuint
}
dwindle {
    pseudotile = false # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = false # You probably want this
}
master {
    new_status = master
}
# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    vfr = true
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
    }
}
device {
    name = epic-mouse-v1
    sensitivity = 1.0
}
$mainMod = SUPER # Sets "Arch" key as main modifier
bind = $mainMod, SPACE, exec, xterm
bind = $mainMod, B, exec, basalt
bind = $mainMod, C, killactive
bind = $mainMod, P, togglefloating,
bind = $mainMod, Q, exec, rofi -show drun
bind = $mainMod, W, exec, rofi -show window
bind = $mainMod, R, exec, rofi -show run
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exec, hyprshot -m region --clipboard-only

bind = ALT SHIFT, right, resizeactive, 100 0
bind = ALT SHIFT, left, resizeactive, -100 0
bind = ALT SHIFT, up, resizeactive, 0 -100
bind = ALT SHIFT, down, resizeactive, 0 100

bind = $mainMod ALT, right, moveactive, 100 0
bind = $mainMod ALT, left, moveactive, -100 0
bind = $mainMod ALT, up, moveactive, 0 -100
bind = $mainMod ALT, down, moveactive, 0 100

bind = $mainMod ALT, W, exec, ~/.archysystem/scripts/menu.sh

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

#windowrule = match:class XTerm, opacity 0.90
windowrule = opacity 1.0 1.0, match:class firefox

